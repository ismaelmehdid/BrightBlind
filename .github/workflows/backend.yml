name: Backend CI/CD

on:
  pull_request:
    paths:
      - "recall/**"
      - "requirements-server.txt"
      - "Dockerfile"
      - "railway.json"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "recall/**"
      - "requirements-server.txt"
      - "Dockerfile"
      - "railway.json"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-server.txt

      - run: pip install -r requirements-server.txt

      - name: Compile
        run: python -m compileall -q recall

      - name: Smoke test (boot server, hit /healthz, check auth)
        env:
          PORT: "8080"
          RECALL_TOKEN: ci-smoke-token-0123456789
          RECALL_DB: ${{ runner.temp }}/recall.db
        run: |
          python -m recall.cloud &
          for i in $(seq 1 20); do curl -sf localhost:8080/healthz && break; sleep 0.5; done
          curl -sf localhost:8080/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' "localhost:8080/?token=$RECALL_TOKEN")" = 200

      - name: Docker build
        run: docker build -t recall-backend .

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --service "${{ vars.RAILWAY_SERVICE }}"
